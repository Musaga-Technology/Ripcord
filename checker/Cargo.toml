[package]
name = "ripcord-checker"
version = "0.1.2"
description = "Ripcord's guard checker: sealed settings, Hyperliquid reads and rescues, run in OutLayer's TEE"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ripcord_checker"
path = "src/lib.rs"

# The enclave binary: `cargo build -p ripcord-checker --release --target wasm32-wasip2 --features outlayer`.
[[bin]]
name = "ripcord-checker"
path = "src/main.rs"
required-features = ["outlayer"]

[features]
outlayer = ["dep:wit-bindgen", "dep:wasi-http-client", "dep:wasi"]

[dependencies]
ripcord-rules = { path = "../crates/rules", features = ["seal"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3 = "0.10"
hex.workspace = true
base64 = "0.22"
wit-bindgen = { version = "0.36", optional = true }
wasi-http-client = { version = "0.2", optional = true }
wasi = { version = "0.13", optional = true }

[dev-dependencies]
ed25519-dalek = "2"
