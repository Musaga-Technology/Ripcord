[package]
name = "ripcord-checker"
version = "0.1.0"
description = "Ripcord's guard checker: sealed settings, Hyperliquid reads and rescues, run in OutLayer's TEE"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ripcord_checker"
path = "src/lib.rs"

[dependencies]
ripcord-rules = { path = "../crates/rules", features = ["seal"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = "2"
