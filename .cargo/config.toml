# NEAR contracts: `--cfg near` makes near-sdk call the host (panic messages, hashing, logs) instead of its local
# fallbacks, as cargo-near does; NEAR runtimes accept the MVP wasm feature set only; strip symbols to keep it small.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "near", "-C", "link-arg=-s", "-C", "target-cpu=mvp"]
