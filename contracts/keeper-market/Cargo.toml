[package]
name = "keeper-market"
version = "0.1.0"
description = "Ripcord's open keeper network on NEAR: the enclave credits the keeper whose check fired a rescue, once per rescue, and keepers claim a bounty from a pool anyone can fund"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29", default-features = false, features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.29", default-features = false, features = ["unstable", "unit-testing"] }
