[package]
name = "guard-registry"
version = "0.1.0"
description = "Ripcord's guard registry on NEAR: hashes not addresses, rounded receipts, and the controller of every guard wallet's policy"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.29", default-features = false, features = ["unstable"] }
ripcord-rules = { path = "../../crates/rules" }
hex = "0.4"
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "5.29", default-features = false, features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
ed25519-dalek = "2"
